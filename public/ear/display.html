<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ear &amp; Balance – Monitor</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/shared/fonts.css" />
    <link rel="stylesheet" href="/shared/style.css" />
    <link rel="stylesheet" href="/ear/display.css" />
  </head>
  <body>
    <!-- Shown on the external monitor connected to the laptop. Follows the tablet automatically. -->
    <div id="bg"><video id="bgVideo" src="/media/ear/home.mp4" autoplay muted loop playsinline></video><div id="bgShade"></div></div>

    <!-- idle: welcome -->
    <section class="scene" id="d-idle">
      <div class="titles">
        <h1 data-i18n="home.title" data-lang="en"></h1>
        <h1 data-i18n="home.title" data-lang="ta"></h1>
        <h1 data-i18n="home.title" data-lang="si"></h1>
      </div>
    </section>

    <!-- condition picture -->
    <section class="scene" id="d-image">
      <div class="picture-wrap">
        <img id="pic" alt="" />
        <div class="fallback-card" id="picFallback">
          <div class="cond-ico" id="fbIcon"></div>
          <h2 id="fbName"></h2>
          <p id="fbText"></p>
        </div>
      </div>
      <div class="caption"><span id="capName"></span></div>
      <div class="timer"><div id="timerBar"></div></div>
    </section>

    <!-- put on the headset -->
    <section class="scene" id="d-wear">
      <div class="wear">
        <svg class="vr-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round">
          <path d="M8 22h48a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H42l-6-7h-8l-6 7H8a4 4 0 0 1-4-4V26a4 4 0 0 1 4-4z" fill="currentColor" fill-opacity=".2" />
          <circle cx="20" cy="33" r="5" />
          <circle cx="44" cy="33" r="5" />
          <path d="M20 22l4-8h16l4 8" />
        </svg>
        <h1 id="wearText"></h1>
        <h2 id="wearName"></h2>
        <p id="wearHint"></p>
      </div>
    </section>

    <!-- experience running -->
    <section class="scene" id="d-running">
      <div class="running">
        <div class="pulse-ring"></div>
        <h1 id="runName"></h1>
        <p id="runHint" class="hint"></p>
        <p id="runText"></p>
        <div class="timer big"><div id="runBar"></div></div>
      </div>
    </section>

    <!-- after: explanation -->
    <section class="scene" id="d-after">
      <div class="after card">
        <h1 id="afterTakeOff"></h1>
        <h2 id="afterName"></h2>
        <h3 id="afterWhatH"></h3>
        <p id="afterWhat"></p>
        <h3 id="afterDocH"></h3>
        <p id="afterDoc"></p>
      </div>
    </section>

    <button id="fsBtn" type="button">⛶ Show full screen on the monitor</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/i18n.js"></script>
    <script src="/ear/js/display.js"></script>
  </body>
</html>
