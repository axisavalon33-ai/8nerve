<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>8th Nerve – stations</title>
    <link rel="stylesheet" href="/shared/fonts.css" />
    <link rel="stylesheet" href="/shared/style.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .card {
        padding: 34px 40px;
        max-width: 640px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        color: var(--blue);
      }
      .links {
        display: grid;
        gap: 14px;
      }
      .links .btn {
        text-decoration: none;
        justify-content: flex-start;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ear &amp; Balance station</h1>
      <div class="links">
        <a class="btn" href="/ear">Tablet – /ear</a>
        <a class="btn violet" href="/vr">VR phone – /vr</a>
        <a class="btn ghost" href="/ear/host">Host / settings – /ear/host</a>
        <a class="btn ghost" href="/ear/record">Record digits – /ear/record</a>
        <a class="btn ghost" href="/ear/display">Monitor display – /ear/display</a>
      </div>
    </div>
  </body>
</html>
